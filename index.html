<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petsy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<style>
:root{--bg:#fff8f1;--card:#fff;--tx:#2b2118;--mut:#8a7a6c;--ac:#ff7a45;--ln:#f0e4d8;--ac2:#ffe3d3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1a1511;--card:#251e18;--tx:#f5ebe0;--mut:#a39384;--ac:#ff8d5c;--ln:#3a2f26;--ac2:#3d2a1f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px)}
#app{max-width:520px;margin:0 auto;padding-bottom:90px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ln)}
.logo{font-size:24px;font-weight:800;color:var(--ac)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ac2);flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:4px 12px 4px 4px}
.post{background:var(--card);border-bottom:1px solid var(--ln);padding:12px 16px}
.ph{display:flex;align-items:center;gap:10px;cursor:pointer}.ph b{display:block;line-height:1.2}.ph small,.mut{color:var(--mut)}
.post p{margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.media{margin:10px -16px 0;width:calc(100% + 32px);max-height:480px;object-fit:cover;display:block}
.acts{display:flex;gap:18px;margin-top:10px}.acts button{color:var(--mut)}.acts .on{color:var(--ac)}
.cm{margin-top:8px;font-size:14px}.cmi{display:flex;gap:8px;margin-top:8px}
input,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;display:inline-block}.btn.s{background:var(--ac2);color:var(--tx)}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;padding:12px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent}.tabs .on{color:var(--ac);border-color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{font-size:26px;padding:2px 14px;opacity:.5}nav .on{opacity:1}
.box{padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--ln);border-radius:99px;padding:6px 12px;background:var(--card);cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.emo{font-size:26px;border-radius:12px;padding:4px 8px;border:2px solid transparent}.emo.on{border-color:var(--ac)}
.prof{text-align:center;padding:24px 16px 8px}.cnt{display:flex;justify-content:center;gap:24px;margin:8px 0}.cnt b{display:block;font-size:18px}
.sw{position:fixed;inset:0;background:#0007;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div id="app"><p class="mut" style="text-align:center;padding:60px">Загрузка…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://hkrqircokynwhbseapxi.supabase.co','sb_publishable_jtKGfMID3eT5AdPmyAX8Ww_eR_YHuk1');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PET=['🐶','🐱','🐰','🐹','🐦','🐠','🐢','🦜','🐴','🐍'],PPL=['🙂','😎','👩','🧔','🧑‍🌾'];
let U=null,MY=[],ME=null,V='feed',TAB='all',POSTS=[],FOL=[],SHEET=null,OPEN={},CM={},Q='',DR='',PINFO=null,VP=null,RES=[],INBOX=[],BD=[],NOTIFS=[],NUNREAD=0,ED=null,CHAT=null,MSGS=[],PEER=null,UNREAD=0,LIST=null,OB={name:'',emoji:'🙂'},NP={name:'',kind:'pet',emoji:'🐶'};
const me=()=>MY.find(p=>p.id===ME);
const av=(p,s=40)=>`<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.55}px">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc(p.emoji)}</span>`;
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;left:16px;right:16px;bottom:90px;max-width:480px;margin:auto;background:#2b2118;color:#fff;padding:12px 16px;border-radius:12px;z-index:20';document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}
function ago(t){const s=(Date.now()-new Date(t))/1000;if(s<60)return'только что';if(s<3600)return Math.floor(s/60)+' мин назад';if(s<86400)return Math.floor(s/3600)+' ч назад';return new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
async function run(p){const{error}=await p;if(error){toast(error.message);return false}return true}

async function init(){
 const{data:{session}}=await sb.auth.getSession();U=session?.user||null;
 sb.auth.onAuthStateChange((_e,s)=>{const n=s?.user||null;if(n?.id!==U?.id){U=n;boot()}});
 sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'posts'},live).on('postgres_changes',{event:'*',schema:'public',table:'likes'},live).on('postgres_changes',{event:'*',schema:'public',table:'comments'},live).on('postgres_changes',{event:'*',schema:'public',table:'messages'},liveM).on('postgres_changes',{event:'*',schema:'public',table:'notifications'},liveN).subscribe();
 boot()}
function live(){if(U&&ME&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))refresh()}
async function boot(){if(!U){MY=[];ME=null;return render()}await loadMy();render();refresh();refreshUnread();refreshN()}
async function loadMy(){const{data}=await sb.from('profiles').select('*').eq('account_id',U.id).order('created_at');MY=data||[];const s=localStorage.getItem('petsy_me');ME=MY.find(p=>p.id===s)?s:MY[0]?.id||null;await loadFol()}
async function loadFol(){if(!ME){FOL=[];return}const{data}=await sb.from('follows').select('followee_id').eq('follower_id',ME);FOL=(data||[]).map(x=>x.followee_id)}

async function refresh(){
 if(!ME)return;
 if(V==='notifs'){await loadNotifs();return render()}
 if(V==='inbox'){await loadInbox();return render()}
 if(V==='chat'){await loadChat();render();scrollTo(0,document.body.scrollHeight);return}
 if(V==='search'){RES=Q?((await sb.from('profiles').select('*').ilike('name','%'+Q.replace(/[%_]/g,'')+'%').limit(30)).data||[]):[];return render()}
 let q=sb.from('posts').select('*,profiles!profile_id(id,name,emoji,avatar_url,kind),likes(profile_id),comments(id)').order('created_at',{ascending:false}).limit(50);
 if(V==='feed'&&TAB==='sub')q=q.in('profile_id',[...FOL,ME]);
 if(V==='profile'){
  q=q.eq('profile_id',VP);
  const cnt=(c,v)=>sb.from('follows').select('*',{count:'exact',head:true}).eq(c,v);
  const[a,b,c]=await Promise.all([sb.from('profiles').select('*').eq('id',VP).single(),cnt('followee_id',VP),cnt('follower_id',VP)]);
  PINFO={p:a.data,fr:b.count||0,fg:c.count||0}}
 if(V==='feed')await loadBd();
 const{data,error}=await q;if(error)toast(error.message);POSTS=data||[];render()}

function postH(x){
 const p=x.profiles,l=x.likes.map(a=>a.profile_id),liked=l.includes(ME),mine=MY.some(m=>m.id===x.profile_id);
 const m=x.media_url?(x.media_type==='video'?`<video class="media" src="${esc(x.media_url)}" controls playsinline></video>`:`<img class="media" src="${esc(x.media_url)}" alt="">`):'';
 const cm=OPEN[x.id]?`<div class="cm">${(CM[x.id]||[]).map(c=>`<div><b>${esc(c.profiles?.name)}</b> ${esc(c.body)}${MY.some(o=>o.id===c.profile_id)?` <a href="#" class="mut" onclick="delC('${c.id}','${x.id}');return false">удалить</a>`:''}</div>`).join('')}<div class="cmi"><input id="c${x.id}" placeholder="Комментарий от имени ${esc(me().name)}…"><button class="btn" onclick="addC('${x.id}','${x.profile_id}')">→</button></div></div>`:'';
 return `<article class="post"><div class="ph" onclick="openP('${p.id}')">${av(p)}<div><b>${esc(p.name)}</b><small>${p.kind==='pet'?'питомец':'человек'} · ${ago(x.created_at)}${x.edited?' · изменено':''}</small></div></div>${x.body?`<p>${esc(x.body)}</p>`:''}${m}
 <div class="acts"><button class="${liked?'on':''}" onclick="like('${x.id}',${liked},'${x.profile_id}')">${liked?'❤️':'🤍'} ${l.length}</button><button onclick="toggleC('${x.id}')">💬 ${x.comments.length}</button>${mine?`<button style="margin-left:auto" onclick="delP('${x.id}')">🗑</button>`:''}</div>${cm}</article>`}

function body(){
 if(V==='inbox')return inboxH();
 if(V==='notifs')return notifH();
 if(V==='chat')return chatH();
 if(V==='create')return `<div class="box"><div class="ph" style="cursor:default">${av(me())}<b>Пост от имени ${esc(me().name)}</b></div><textarea id="tx" rows="4" style="margin-top:12px" placeholder="Что нового у ${esc(me().name)}?" oninput="DR=this.value">${esc(DR)}</textarea><div class="row"><label class="btn s">📷 Фото / видео<input id="fl" type="file" accept="image/*,video/*" hidden onchange="this.previousSibling.nodeValue='📎 '+this.files[0].name+' '"></label><button class="btn" id="pb" onclick="publish()">Опубликовать</button></div></div>`;
 if(V==='search')return `<div class="box"><input placeholder="🔍 Поиск по имени, Enter" value="${esc(Q)}" onkeydown="if(event.key==='Enter'){Q=this.value.trim();refresh()}"></div>${RES.map(p=>`<div class="ph" style="padding:10px 16px" onclick="openP('${p.id}')">${av(p)}<div><b>${esc(p.name)}</b><small>${p.kind==='pet'?'питомец'+(p.breed?' · '+esc(p.breed):''):'человек'}</small></div></div>`).join('')||(Q?'<p class="mut box">Ничего не найдено</p>':'')}`;
 if(V==='profile'&&PINFO?.p){const p=PINFO.p,own=MY.some(x=>x.id===p.id),f=FOL.includes(p.id);
  return `<div class="prof">${av(p,88)}<h2 style="margin:10px 0 0">${esc(p.name)}</h2><div class="mut">${p.kind==='pet'?'Питомец'+(p.breed?' · '+esc(p.breed):''):'Человек'}${p.birthday?' · 🎂 '+ageStr(p.birthday):''}</div><p>${esc(p.bio)}</p><div class="cnt"><div><b>${POSTS.length}</b><span class="mut">постов</span></div><div onclick="showList('fr')" style="cursor:pointer"><b>${PINFO.fr}</b><span class="mut">подписчиков</span></div><div onclick="showList('fg')" style="cursor:pointer"><b>${PINFO.fg}</b><span class="mut">подписок</span></div></div>${own?`<button class="btn s" onclick="openEd()">✏️ Редактировать</button>`:`<div class="row" style="justify-content:center"><button class="btn ${f?'s':''}" onclick="follow('${p.id}')">${f?'Вы подписаны ✓':'Подписаться'}</button><button class="btn s" onclick="openChat('${p.id}')">💬 Написать</button></div>`}</div>${POSTS.map(postH).join('')||'<p class="mut" style="text-align:center">Пока нет постов</p>'}`}
 const sub=TAB==='sub';
 return `<div class="tabs"><button class="${sub?'':'on'}" onclick="TAB='all';refresh()">Для вас</button><button class="${sub?'on':''}" onclick="TAB='sub';refresh()">Подписки</button></div>${BD.map(bdH).join('')}${POSTS.map(postH).join('')||`<p class="mut" style="text-align:center;padding:40px 16px">${sub?'Подпишитесь на кого-нибудь через 🔍 поиск':'Пока нет постов. Напишите первый! 🐾'}</p>`}`}

function sheetH(){
 if(SHEET==='list')return listH();
 if(SHEET==='edit')return editH();
 if(SHEET==='sw')return `<div class="sw" onclick="if(event.target===this){SHEET=null;render()}"><div class="sh"><b>Действовать от имени</b>${MY.map(p=>`<div class="ph" style="padding:10px 0" onclick="setMe('${p.id}')">${av(p)}<div><b>${esc(p.name)}</b><small>${p.kind==='pet'?'питомец':'человек'}</small></div>${p.id===ME?'<span style="margin-left:auto">✓</span>':''}</div>`).join('')}<button class="btn" style="width:100%;margin-top:8px" onclick="SHEET='new';render()">+ Новый профиль</button><button class="btn s" style="width:100%;margin-top:8px" onclick="sb.auth.signOut()">Выйти</button></div></div>`;
 if(SHEET==='new'){const l=NP.kind==='pet'?PET:PPL;return `<div class="sw" onclick="if(event.target===this){SHEET=null;render()}"><div class="sh"><b>Новый профиль</b><div class="row"><span class="chip ${NP.kind==='pet'?'on':''}" onclick="NP.kind='pet';NP.emoji='🐶';render()">🐾 Питомец</span><span class="chip ${NP.kind==='person'?'on':''}" onclick="NP.kind='person';NP.emoji='🙂';render()">🙂 Человек</span></div><div class="row">${l.map(e=>`<button class="emo ${NP.emoji===e?'on':''}" onclick="NP.emoji='${e}';render()">${e}</button>`).join('')}</div><input placeholder="${NP.kind==='pet'?'Кличка':'Имя'}" value="${esc(NP.name)}" oninput="NP.name=this.value"><button class="btn" style="width:100%;margin-top:12px" onclick="createP(NP)">Создать</button></div></div>`}
 return ''}

function render(){const a=$('#app');
 if(!U)return a.innerHTML=`<div class="box" style="padding-top:60px"><div class="logo" style="text-align:center;font-size:36px">🐾 Petsy</div><p class="mut" style="text-align:center">Соцсеть для тех, кто любит питомцев</p><input id="em" type="email" placeholder="Почта" autocomplete="email" style="margin-bottom:8px"><input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password"><div class="row"><button class="btn" style="flex:1" onclick="auth(0)">Войти</button><button class="btn s" style="flex:1" onclick="auth(1)">Регистрация</button></div></div>`;
 if(!MY.length)return a.innerHTML=`<div class="box" style="padding-top:50px"><div class="logo" style="text-align:center;font-size:30px">Создайте профиль</div><p class="mut" style="text-align:center">Питомцев можно добавить потом.</p><div class="row" style="justify-content:center">${PPL.map(e=>`<button class="emo ${OB.emoji===e?'on':''}" onclick="OB.emoji='${e}';render()">${e}</button>`).join('')}</div><input placeholder="Ваше имя" value="${esc(OB.name)}" oninput="OB.name=this.value"><button class="btn" style="width:100%;margin-top:12px" onclick="createP({name:OB.name,kind:'person',emoji:OB.emoji})">Присоединиться</button></div>`;
 const m=me(),n=(v,i,f)=>`<button class="${V===v?'on':''}" onclick="${f||`V='${v}';refresh()`}">${i}</button>`;
 a.innerHTML=`<header><span class="logo">🐾 Petsy</span><span style="display:flex;gap:10px;align-items:center"><button style="font-size:22px" onclick="V='notifs';NOTIFS=[];refresh()">🔔<sup id="nb" style="font-size:11px;color:var(--ac);font-weight:700">${NUNREAD||''}</sup></button><button class="me" onclick="SHEET='sw';render()">${av(m,28)}<b>${esc(m.name)}</b> ▾</button></span></header>${body()}<nav>${n('feed','🏠')}${n('search','🔍')}${n('create','➕')}<button class="${V==='inbox'||V==='chat'?'on':''}" onclick="V='inbox';refresh()">💬<sup id="ub" style="font-size:11px;color:var(--ac);font-weight:700">${UNREAD||''}</sup></button>${n('profile',esc(m.emoji),`openP('${m.id}')`)}</nav>${sheetH()}`}

async function auth(up){const email=$('#em').value.trim(),password=$('#pw').value;
 const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return toast(r.error.message);if(up&&!r.data.session)toast('Проверьте почту и подтвердите адрес')}
async function createP(o){const name=(o.name||'').trim();if(!name)return;
 const{data,error}=await sb.from('profiles').insert({account_id:U.id,kind:o.kind,name,emoji:o.emoji}).select().single();
 if(error)return toast(error.message);MY.push(data);setMe(data.id);NP={name:'',kind:'pet',emoji:'🐶'}}
async function setMe(id){ME=id;localStorage.setItem('petsy_me',id);SHEET=null;await loadFol();V='feed';refresh();refreshUnread();refreshN()}
function openP(id){VP=id;V='profile';SHEET=null;refresh();scrollTo(0,0)}
async function like(id,liked,to){const ok=await run(liked?sb.from('likes').delete().eq('post_id',id).eq('profile_id',ME):sb.from('likes').insert({post_id:id,profile_id:ME}));if(ok&&!liked)notify(to,'like',id);refresh()}
async function toggleC(id){OPEN[id]=!OPEN[id];if(OPEN[id])await loadC(id);render()}
async function loadC(id){CM[id]=(await sb.from('comments').select('id,body,profile_id,profiles!profile_id(name)').eq('post_id',id).order('created_at')).data||[]}
async function addC(id,to){const el=$('#c'+id),t=el.value.trim();if(!t)return;
 if(await run(sb.from('comments').insert({post_id:id,profile_id:ME,body:t}))){notify(to,'comment',id);await loadC(id);refresh()}}
async function delC(c,id){if(await run(sb.from('comments').delete().eq('id',c))){await loadC(id);refresh()}}
async function delP(id){if(confirm('Удалить пост?')&&await run(sb.from('posts').delete().eq('id',id)))refresh()}
async function follow(id){const f=FOL.includes(id);
 if(await run(f?sb.from('follows').delete().eq('follower_id',ME).eq('followee_id',id):sb.from('follows').insert({follower_id:ME,followee_id:id}))){if(!f)notify(id,'follow');await loadFol();if(SHEET==='list')await loadList();refresh()}}
async function publish(){const t=$('#tx').value.trim(),f=$('#fl').files[0];if(!t&&!f)return;$('#pb').disabled=true;let url=null,type=null;
 if(f){const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,''),path=`${U.id}/${Date.now()}.${ext}`;
  const{error}=await sb.storage.from('media').upload(path,f,{contentType:f.type});if(error){$('#pb').disabled=false;return toast(error.message)}
  url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;type=f.type.startsWith('video')?'video':'image'}
 if(await run(sb.from('posts').insert({profile_id:ME,body:t,media_url:url,media_type:type}))){DR='';V='feed';TAB='all';refresh()}else $('#pb').disabled=false}
async function refreshUnread(){if(!ME)return;const{count}=await sb.from('messages').select('id',{count:'exact',head:true}).eq('recipient_id',ME).eq('is_read',false);UNREAD=count||0;const e=$('#ub');if(e)e.textContent=UNREAD||''}
async function loadInbox(){const{data}=await sb.from('messages').select('*').or(`sender_id.eq.${ME},recipient_id.eq.${ME}`).order('created_at',{ascending:false}).limit(300);
 const m=new Map();(data||[]).forEach(x=>{const pid=x.sender_id===ME?x.recipient_id:x.sender_id;if(!m.has(pid))m.set(pid,{last:x,unread:0});if(x.recipient_id===ME&&!x.is_read)m.get(pid).unread++});
 const ids=[...m.keys()],ps=ids.length?((await sb.from('profiles').select('*').in('id',ids)).data||[]):[];
 INBOX=ids.map(id=>({...m.get(id),p:ps.find(p=>p.id===id)})).filter(x=>x.p)}
async function loadChat(){const f=`and(sender_id.eq.${ME},recipient_id.eq.${CHAT}),and(sender_id.eq.${CHAT},recipient_id.eq.${ME})`;
 const[a,b]=await Promise.all([sb.from('messages').select('*').or(f).order('created_at').limit(300),sb.from('profiles').select('*').eq('id',CHAT).single()]);
 MSGS=a.data||[];PEER=b.data;
 if(MSGS.some(x=>x.recipient_id===ME&&!x.is_read)){await sb.from('messages').update({is_read:true}).eq('recipient_id',ME).eq('sender_id',CHAT).eq('is_read',false);refreshUnread()}}
async function liveM(){if(!U||!ME)return;await refreshUnread();if(V==='chat'){await loadChat();renderThread()}else if(V==='inbox'){await loadInbox();render()}}
function openChat(id){CHAT=id;PEER=null;V='chat';SHEET=null;refresh()}
async function sendM(){const el=$('#mi'),t=el.value.trim();if(!t)return;el.value='';if(await run(sb.from('messages').insert({sender_id:ME,recipient_id:CHAT,body:t}))){await loadChat();renderThread()}}
function thH(){return MSGS.map(m=>{const mine=m.sender_id===ME;return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:78%;padding:8px 12px;border-radius:16px;background:${mine?'var(--ac)':'var(--card)'};color:${mine?'#fff':'var(--tx)'};border:1px solid var(--ln);word-break:break-word">${esc(m.body)}<div style="font-size:11px;opacity:.7">${ago(m.created_at)}</div></div>`}).join('')||'<p class="mut" style="text-align:center">Скажите привет 👋</p>'}
function renderThread(){const t=$('#th');if(t){t.innerHTML=thH();scrollTo(0,document.body.scrollHeight)}}
function chatH(){if(!PEER)return '<p class="mut" style="text-align:center;padding:40px">Загрузка…</p>';
 return `<div class="ph" style="padding:10px 16px;border-bottom:1px solid var(--ln)"><button onclick="V='inbox';refresh()" style="font-size:20px">←</button><span onclick="openP('${PEER.id}')" style="display:flex;gap:10px;align-items:center">${av(PEER,36)}<b>${esc(PEER.name)}</b></span></div><div id="th" style="padding:12px 16px;display:flex;flex-direction:column;gap:6px">${thH()}</div><div class="cmi" style="padding:0 16px"><input id="mi" placeholder="Сообщение от имени ${esc(me().name)}…" onkeydown="if(event.key==='Enter')sendM()"><button class="btn" onclick="sendM()">→</button></div>`}
function inboxH(){return `<div class="box"><b style="font-size:18px">Сообщения</b></div>`+(INBOX.map(c=>`<div class="ph" style="padding:12px 16px;border-bottom:1px solid var(--ln)" onclick="openChat('${c.p.id}')">${av(c.p,48)}<div style="min-width:0"><b>${esc(c.p.name)}</b><small style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.last.sender_id===ME?'Вы: ':''}${esc(c.last.body)}</small></div>${c.unread?`<span class="chip on" style="margin-left:auto">${c.unread}</span>`:''}</div>`).join('')||'<p class="mut" style="text-align:center;padding:32px 16px">Нет диалогов. Откройте чужой профиль и нажмите «Написать» 🐾</p>')}
async function loadList(){const sel='id,name,emoji,avatar_url,kind',fr=LIST.mode==='fr',
 r=fr?await sb.from('follows').select(`profiles!follower_id(${sel})`).eq('followee_id',VP):await sb.from('follows').select(`profiles!followee_id(${sel})`).eq('follower_id',VP);
 LIST.items=(r.data||[]).map(x=>x.profiles).filter(Boolean)}
async function showList(mode){LIST={mode,items:[]};SHEET='list';render();await loadList();render()}
function listH(){return `<div class="sw" onclick="if(event.target===this){SHEET=null;render()}"><div class="sh" style="max-height:70vh;overflow:auto"><b>${LIST.mode==='fr'?'Подписчики':'Подписки'}</b>${LIST.items.map(p=>`<div class="ph" style="padding:10px 0" onclick="openP('${p.id}')">${av(p)}<div><b>${esc(p.name)}</b><small>${p.kind==='pet'?'питомец':'человек'}</small></div>${MY.some(m=>m.id===p.id)?'':`<button class="btn ${FOL.includes(p.id)?'s':''}" style="margin-left:auto;padding:6px 12px" onclick="event.stopPropagation();follow('${p.id}')">${FOL.includes(p.id)?'Вы подписаны':'Подписаться'}</button>`}</div>`).join('')||'<p class="mut">Пока никого</p>'}</div></div>`}
const NT={like:'оценил(а) ваш пост',comment:'прокомментировал(а) ваш пост',follow:'подписался(лась) на вас'};
async function notify(to,type,post){if(!to||MY.some(m=>m.id===to))return;await sb.from('notifications').insert({recipient_id:to,actor_id:ME,type,post_id:post||null})}
async function refreshN(){if(!ME)return;const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('recipient_id',ME).eq('is_read',false);NUNREAD=count||0;const e=$('#nb');if(e)e.textContent=NUNREAD||''}
async function loadNotifs(){const prev=new Set(NOTIFS.filter(n=>n.was).map(n=>n.id));
 const{data}=await sb.from('notifications').select('*,actor:profiles!actor_id(id,name,emoji,avatar_url,kind)').eq('recipient_id',ME).order('created_at',{ascending:false}).limit(50);
 NOTIFS=(data||[]).map(n=>({...n,was:!n.is_read||prev.has(n.id)}));
 if(NOTIFS.some(n=>!n.is_read)){await sb.from('notifications').update({is_read:true}).eq('recipient_id',ME).eq('is_read',false);refreshN()}}
async function liveN(){if(!U||!ME)return;await refreshN();if(V==='notifs'){await loadNotifs();render()}}
function notifH(){return `<div class="box"><b style="font-size:18px">Уведомления</b></div>`+(NOTIFS.map(n=>{const p=n.actor;if(!p)return '';return `<div class="ph" style="padding:12px 16px;border-bottom:1px solid var(--ln);background:${n.was?'var(--ac2)':'transparent'}" onclick="openP('${p.id}')">${av(p)}<div><b>${esc(p.name)}</b> ${NT[n.type]||''}<small style="display:block">${ago(n.created_at)}</small></div></div>`}).join('')||'<p class="mut" style="text-align:center;padding:32px">Пока тишина 🐾</p>')}
function ageStr(bd){const d=new Date(bd),n=new Date();let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;if(isNaN(m)||m<0)return'';if(m<12)return m+' мес.';const y=Math.floor(m/12),l=y%10,w=l===1&&y%100!==11?'год':(l>=2&&l<=4&&(y%100<10||y%100>=20))?'года':'лет';return y+' '+w}
async function loadBd(){const ids=[...new Set([...FOL,...MY.map(m=>m.id)])];if(!ids.length){BD=[];return}
 const t=new Date(),md=String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
 const{data}=await sb.from('profiles').select('id,name,emoji,avatar_url,birthday').in('id',ids).not('birthday','is',null);
 BD=(data||[]).filter(p=>p.birthday.slice(5)===md)}
function bdH(p){return `<div class="box" style="background:var(--ac2);border-bottom:1px solid var(--ln);display:flex;gap:10px;align-items:center;cursor:pointer" onclick="bdPost('${p.id}')"><span style="font-size:28px">🎂</span><div><b>У ${esc(p.name)} сегодня день рождения!</b><div class="mut">${ageStr(p.birthday)} · нажмите, чтобы поздравить</div></div></div>`}
function bdPost(id){const p=BD.find(x=>x.id===id);if(!p)return;DR='🎉 С днём рождения, '+p.name+'! 🐾';V='create';render()}
function openEd(){const p=PINFO.p;ED={id:p.id,kind:p.kind,emoji:p.emoji,name:p.name,bio:p.bio||'',breed:p.breed||'',birthday:p.birthday||'',avatar_url:p.avatar_url||null};SHEET='edit';render()}
async function pickAv(i){const f=i.files[0];if(!f)return;const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''),path=`${U.id}/av_${Date.now()}.${ext}`;
 const{error}=await sb.storage.from('media').upload(path,f,{contentType:f.type});if(error)return toast(error.message);ED.avatar_url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;render()}
async function saveEd(){const e=ED,name=e.name.trim();if(!name)return;
 if(await run(sb.from('profiles').update({name,bio:e.bio.trim(),breed:e.breed.trim()||null,birthday:e.birthday||null,avatar_url:e.avatar_url}).eq('id',e.id))){await loadMy();SHEET=null;refresh()}}
function editH(){const e=ED,pet=e.kind==='pet';return `<div class="sw" onclick="if(event.target===this){SHEET=null;render()}"><div class="sh" style="max-height:85vh;overflow:auto"><b>Редактировать профиль</b><div style="text-align:center;margin:10px 0">${av({avatar_url:e.avatar_url,emoji:e.emoji},72)}</div><div class="row" style="justify-content:center"><label class="btn s">📷 Фото<input type="file" accept="image/*" hidden onchange="pickAv(this)"></label>${e.avatar_url?`<button class="btn s" onclick="ED.avatar_url=null;render()">Убрать фото</button>`:''}</div><input placeholder="Имя" value="${esc(e.name)}" oninput="ED.name=this.value" style="margin-bottom:8px"><textarea rows="3" placeholder="О себе" oninput="ED.bio=this.value">${esc(e.bio)}</textarea>${pet?`<input placeholder="Порода" value="${esc(e.breed)}" oninput="ED.breed=this.value" style="margin-top:8px"><label class="mut" style="display:block;margin-top:8px;font-size:13px">Дата рождения<input type="date" value="${e.birthday||''}" oninput="ED.birthday=this.value"></label>`:''}<button class="btn" style="width:100%;margin-top:12px" onclick="saveEd()">Сохранить</button></div></div>`}
init();
</script>
</body>
</html>
